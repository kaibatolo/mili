[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mili"
version = "0.2.0"
description = "Mili — your seductive Venice AI orchestrator. Chat, image, agents... all uncensored and delicious."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "typer[all]>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0",
  "orjson>=3.10.0",
]

[project.scripts]
mili = "venice_cli.cli:app"
